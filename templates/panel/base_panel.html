<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel</title>

    {% load static %}

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="panel-body">

<div class="panel-layout">

  <nav class="panel-nav">
    <h2><i class="fa-solid fa-crow"></i> Rara Panel</h2>

    <a href="/panel/"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    <a href="/panel/productos/"><i class="fa-solid fa-box-open"></i> Gestión de Productos</a>
    <a href="/panel/pedidos/"><i class="fa-solid fa-truck-fast"></i> Gestión de Pedidos</a>
    <a href="/panel/cupones/"><i class="fa-solid fa-ticket"></i> Gestión de Cupones</a>
    <a href="/"><i class="fa-solid fa-store"></i> Ver tienda</a>
    
    {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button class="btn-logout-clean" type="submit">
          <i class="fa-solid fa-power-off"></i> Cerrar sesión
        </button>
    </form>
    {% endif %}
  </nav>

  <main class="panel-main">
    {% if messages %}
      <div style="margin-bottom: 20px;">
        {% for message in messages %}
          <div style="padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; font-weight: 500; {% if message.tags == 'success' %}background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% elif message.tags == 'warning' %}background-color: #fff3cd; color: #856404; border: 1px solid #ffe8a1;{% elif message.tags == 'info' %}background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb;{% else %}background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% endif %} display: flex; justify-content: space-between; align-items: center;">
            <span>{{ message }}</span>
            <button type="button" onclick="this.parentElement.remove();" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: inherit; opacity: 0.7; margin-left: 10px;">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

</div>

</body>
</html>
